# ─────────────────────────────────────────────────────────────────────────────
# Blueprint de Render → permite desplegar con "New + → Blueprint" usando este
# archivo (arrastrar el repo y Render crea el servicio solo).
#
# Variables que pedirá configurar (sin valor en el repo):
#   DATABASE_URL, JWT_SECRET, GROQ_API_KEY, GOOGLE_CLIENT_ID
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: cici
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # configúrala manualmente (Neon/Supabase/Render Postgres)
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PORT
        value: 10000